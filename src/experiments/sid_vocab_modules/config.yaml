# SID-VocabModules: тот же boosting-механизм, что SID-P-Boost (кумулятивная
# сумма логитов под stop-gradient + обучаемый alpha_i), но собственная
# коррекция каждого блока идёт не через полный vocab-readout, а через
# маленький линейный модуль G_i (n_embd -> proj_dim) и ФИКСИРОВАННУЮ случайную
# sparse-проекцию P_i (proj_dim x vocab_size, разную для каждого блока,
# не обучается): Δz_i = G_i(h_i) @ P_i. Идея: математически сделать
# невозможным, чтобы все блоки оптимизировали буквально одну и ту же
# full-vocabulary задачу — каждый ограничен своим случайным подпространством
# логитов (см. docs/memory.md, ensemble-идея про частоты словаря).
model:
  block_size: 256
  vocab_size: 16384
  n_layer: 12
  n_head: 4
  n_embd: 272
  dropout: 0.0
  bias: true

data:
  data_dir: data/wikitext

sid:
  k: 6
  source_checkpoint: checkpoints/checkpoint_50pct.pt
  proj_dim: 256          # размерность проекции (<< vocab_size=16384)
  sparsity: 0.1           # доля ненулевых столбцов в каждой строке P_i
  projection_seed: 0      # фиксирует P_i между запусками для воспроизводимости

train:
  micro_batch_size: 64
  grad_accumulation_steps: 4
  grad_clip: 1.0
  peak_lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  target_tokens: 100000000
  min_train_metric_points: 30
  validation_every: 100
  validation_batches: 20
  eval_seed: 1337

checkpoint:
  dir: checkpoints_sid_vocab_modules

comet:
  enabled: true
  workspace: team-rl-exp

smoke:
  target_tokens: 200000
  validation_every: 5
  validation_batches: 2
