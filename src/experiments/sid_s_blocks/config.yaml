# SID-S с реальными верхними блоками: первый блок (k=5 слоёв, multi-token
# loss) + 7 верхних блоков по 1 слою, полная consistency-формула
# L_i = CE(y, p_i^tau) + lambda*tau^2*KL(sg(q_{i-1}^tau) || p_i^tau)
# (docs/PLAN.md §5.1), chunked (src/sid/chunked.py::chunked_consistency_loss).
model:
  block_size: 256
  vocab_size: 16384
  n_layer: 12
  n_head: 4
  n_embd: 272
  dropout: 0.0
  bias: true

data:
  data_dir: data/wikitext

sid:
  k: 5
  tau: 1.0
  lambda_target: 0.5
  lambda_warmup_fraction: 0.10

train:
  micro_batch_size: 64
  grad_accumulation_steps: 4
  grad_clip: 1.0
  peak_lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  target_tokens: 5000000  # короткий пилот по умолчанию (consistency-KL, ранее не проверялся)
  min_train_metric_points: 30
  validation_every: 100
  validation_batches: 20
  eval_seed: 1337

checkpoint:
  dir: checkpoints_sid_s_blocks

comet:
  enabled: true
  workspace: team-rl-exp

smoke:
  target_tokens: 200000
  validation_every: 5
  validation_batches: 2
